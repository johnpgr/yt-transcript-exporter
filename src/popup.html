<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Transcript Exporter</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container" id="appContainer">
    <!-- Header -->
    <header class="header">
      <div class="logo-container">
        <svg class="logo-svg" viewBox="0 0 24 24" width="20" height="20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 8.5L15 12L10 15.5V8.5Z" fill="currentColor" />
          <path d="M7 18H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
          <path d="M7 6H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span class="logo-text" data-i18n="appName">YT Transcript</span>
      </div>
      <span class="badge">v1.0</span>
    </header>

    <!-- Settings Card -->
    <main class="main-content">
      <div class="settings-card">
        <!-- Timestamp Toggle Option -->
        <div class="setting-row">
          <div class="setting-info">
            <label for="timestampToggle" class="setting-title" data-i18n="includeTimestampsLabel">Include Timestamps</label>
            <span class="setting-desc" data-i18n="includeTimestampsDesc">Add time indicators to each line</span>
          </div>
          <div class="toggle-wrapper">
            <input type="checkbox" id="timestampToggle" class="toggle-checkbox" checked />
            <label for="timestampToggle" class="toggle-label"></label>
          </div>
        </div>

        <hr class="divider" />

        <!-- Format Option -->
        <div class="setting-row vertical">
          <div class="setting-info">
            <span class="setting-title" data-i18n="exportFormatLabel">Export Format</span>
            <span class="setting-desc" data-i18n="exportFormatDesc">Choose the output file structure</span>
          </div>
          <div class="segmented-control">
            <input type="radio" id="formatTxt" name="exportFormat" value="txt" />
            <label for="formatTxt" class="segment-item">.txt</label>
            
            <input type="radio" id="formatMd" name="exportFormat" value="md" checked />
            <label for="formatMd" class="segment-item">.md</label>
            
            <div class="selection-slider"></div>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button class="action-btn" id="exportBtn">
        <span class="btn-text" data-i18n="exportBtnLabel">Export Transcript</span>
        <svg class="btn-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
      </button>

      <!-- Status Logs -->
      <div class="status-panel collapsed" id="statusPanel">
        <div class="panel-header">
          <span class="panel-title" data-i18n="progressLogsLabel">Progress Logs</span>
          <span class="status-indicator-dot idle" id="statusDot"></span>
        </div>
        <div class="logs-container" id="logsContainer">
          <div class="log-entry system" data-i18n="readyToExtract">Ready to extract.</div>
        </div>
      </div>
    </main>
  </div>
  
  <!-- Load entry coordinator as standard native ES module -->
  <script type="module" src="popup.js"></script>
</body>
</html>
